# Signal Check — show configuration.
# Edit this file on GitHub to change the show. Every run reads it fresh.

show:
  title: Signal Check
  tagline: Your weekday briefing, checked twice.
  description: >-
    A short weekday news podcast for curious technologists: AI and software,
    self-hosting and hardware, world news, Estonia, markets and games, plus a
    weekly look at something completely outside the bubble. Signal Check is
    produced with AI: Mia and Theo are AI-generated hosts.
  # Public URL of the GitHub Pages site, no trailing slash. Fill in after enabling Pages.
  site_url: https://ddeivid.github.io/signal-check
  language: en
  author: Signal Check
  owner_name: Deivid
  # Spotify sends a verification code to this address. Set it only while
  # verifying, then blank it again so it isn't published in the feed.
  owner_email: ""
  categories: [News, Technology]
  explicit: false
  timezone: Europe/Tallinn
  # Spoken at the top of every episode, word for word.
  opening:
    - speaker: Mia
      text: "Good morning, this is Signal Check for {weekday}, {date}. I'm Mia."
    - speaker: Theo
      text: "And I'm Theo. Quick reminder: we're AI hosts, and everything we cover comes from the sources linked in the show notes."
  closing:
    - speaker: Mia
      text: "That's Signal Check for today. Sources and the full transcript are in the show notes."
    - speaker: Theo
      text: "See you tomorrow."

hosts:
  - name: Mia
    voice: Aoede
    persona: >-
      Curious generalist and the guide. Sets up each story in plain language,
      connects it to earlier episodes, asks the questions a smart listener would.
    # How the voice should sound by default (sent to the voice model).
    delivery: warm, curious, upbeat
  - name: Theo
    voice: Iapetus
    persona: >-
      Sharp skeptic. Pushes on claims, asks who benefits and what's missing,
      separates what is known from what is speculation. Dry, never cynical.
    delivery: dry, measured, quietly amused

# What gets covered. Feeds below point at these topic ids.
topics:
  core:
    - id: ai_software
      label: AI and software engineering, including frontend
    - id: selfhosting
      label: Self-hosting, hardware and maker projects
    - id: world
      label: World news and politics
    - id: estonia
      label: Estonia and the Baltics
    - id: markets
      label: Stock markets and the economy
    - id: gaming
      label: Gaming
  # Share of the episode drawn from core topics; the rest comes from outside them.
  core_share: 0.75

episode:
  words_per_minute: 150
  headlines: 5
  main_stories: 2
  quick_hits: 4

schedule:
  # The news window runs from the last published episode, capped at this many days.
  window_cap_days: 4
  # Window for the very first episode.
  first_run_hours: 30
  weekdays:
    monday: { segment: look_back, minutes: 15 }
    tuesday: { segment: deep_dive, minutes: 12 }
    wednesday: { segment: far_field, minutes: 12 }
    thursday: { segment: markets, minutes: 12 }
    friday: { segment: prediction_check, minutes: 12 }
  # One-off extra episodes on days the show normally skips (weekends): date → which weekday's format.
  # Past dates do nothing; remove them whenever.
  extra_days:
    "2026-10-17": wednesday   # Saturday: Far field
    "2026-10-18": tuesday     # Sunday: Deep dive

segments:
  look_back:
    title: The look-back
    brief: >-
      Weekend roundup of what happened since Friday, a short review of last
      week's episodes, and "still developing": stories from last week that moved.
  deep_dive:
    title: Deep dive
    brief: >-
      Go deep on the first main story: background, how we got here, the
      strongest arguments on each side, and what to watch next.
  far_field:
    title: Far field
    brief: >-
      One story from well outside the usual topics (science, culture, nature,
      history, health). Explain why it matters to someone who never reads about it.
  markets:
    title: Markets and numbers
    brief: >-
      Read the market table: what moved this week and by how much. Numbers come
      only from the table. Explain context from the news, never give advice.
  prediction_check:
    title: Prediction check and weekend picks
    brief: >-
      Grade this week's predictions from earlier episodes (right, wrong, too
      early), then give two or three weekend picks from the week's stories.

feeds:
  # AI and software
  - { name: Hacker News (150+ points), url: "https://hnrss.org/frontpage?points=150", topic: ai_software }
  - { name: Simon Willison, url: "https://simonwillison.net/atom/everything/", topic: ai_software }
  - { name: The Verge AI, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", topic: ai_software }
  - { name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", topic: ai_software }
  - { name: Smashing Magazine, url: "https://www.smashingmagazine.com/feed/", topic: ai_software }
  - { name: JavaScript Weekly, url: "https://cprss.s3.amazonaws.com/javascriptweekly.com.xml", topic: ai_software }
  # Self-hosting, hardware, maker
  - { name: Hackaday, url: "https://hackaday.com/blog/feed/", topic: selfhosting }
  - { name: selfh.st, url: "https://selfh.st/rss/", topic: selfhosting }
  - { name: CNX Software, url: "https://www.cnx-software.com/feed/", topic: selfhosting }
  - { name: Tom's Hardware, url: "https://www.tomshardware.com/feeds/all", topic: selfhosting }
  # World news and politics
  - { name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml", topic: world }
  - { name: NPR World, url: "https://feeds.npr.org/1004/rss.xml", topic: world }
  - { name: The Guardian World, url: "https://www.theguardian.com/world/rss", topic: world }
  - { name: DW, url: "https://rss.dw.com/rdf/rss-en-all", topic: world }
  # Estonia and the Baltics
  - { name: ERR News, url: "https://news.err.ee/rss", topic: estonia }
  - { name: LSM English, url: "https://eng.lsm.lv/rss/", topic: estonia }
  # Markets
  - { name: CNBC Markets, url: "https://www.cnbc.com/id/10000664/device/rss/rss.html", topic: markets }
  - { name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", topic: markets }
  # Gaming
  - { name: Rock Paper Shotgun, url: "https://www.rockpapershotgun.com/feed", topic: gaming }
  - { name: GamesIndustry.biz, url: "https://www.gamesindustry.biz/feed", topic: gaming }
  - { name: Polygon, url: "https://www.polygon.com/rss/index.xml", topic: gaming }
  # Outside the bubble (any topic id not listed under topics.core counts as outside)
  - { name: Quanta Magazine, url: "https://api.quantamagazine.org/feed/", topic: science }
  - { name: BBC Science, url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml", topic: science }
  - { name: Nature News, url: "https://www.nature.com/nature.rss", topic: science }
  - { name: Grist, url: "https://grist.org/feed/", topic: climate }
  - { name: Aeon, url: "https://aeon.co/feed.rss", topic: culture }
  - { name: Atlas Obscura, url: "https://www.atlasobscura.com/feeds/latest", topic: culture }

markets:
  # Yahoo Finance chart API (no key). Numbers in the show come only from here.
  instruments:
    - { label: S&P 500, symbol: "^GSPC" }
    - { label: Nasdaq 100, symbol: "^NDX" }
    - { label: DAX, symbol: "^GDAXI" }
    - { label: EUR/USD, symbol: "EURUSD=X" }
    - { label: Bitcoin, symbol: "BTC-USD" }
    - { label: Gold, symbol: "GC=F" }
    - { label: Brent oil, symbol: "BZ=F" }

llm:
  # Text stages. Tried in order: a busy or rate-limited model falls through to the next.
  # "Check feeds" lists the models your key can use. Pin versions once episodes sound good.
  models: [gemini-flash-latest, gemini-3.7-flash, gemini-3.5-flash, gemini-flash-lite-latest]
  temperature: 0.7
  # Spacing between LLM calls, to stay inside free-tier rate limits.
  min_seconds_between_calls: 5
  # Optional fallback when Gemini keeps failing. Needs OPENROUTER_API_KEY; empty model = off.
  fallback_model: ""

research:
  # Let the research stage search the web (Gemini grounding). Off: the free tier had no search
  # quota on 2026-10-15 (429 on every model). Turn on if the key gets paid quota.
  grounding: false
  # Characters of article text fetched per story.
  article_chars: 6000

quality:
  # Fact-check and rules run first; the script is revised up to this many times.
  max_revisions: 3
  # What to do if blocking issues remain after the last revision: stop | publish
  on_unresolved: stop
  # Allowed deviation from the target word count before it counts as an issue.
  length_tolerance: 0.2
  max_line_words: 80
  banned_phrases:
    - "buckle up"
    - "game-changer"
    - "in today's fast-paced world"
    - "let's dive in"
    - "stay tuned"

tts:
  # Tried in order; one model per episode. 3.8 models get per-line direction (each line's
  # delivery cue); 3.1 only gets each host's default delivery, since inline cues might be read aloud.
  models: [gemini-3.8-flash-tts, gemini-3.8-flash-lite-tts, gemini-3.1-flash-tts-preview]
  # These want one part per speaker line; listing them saves a rejected first request per run.
  speaker_part_models: [gemini-3.8-flash-tts, gemini-3.8-flash-lite-tts]
  # Both hosts go in one request; the script is split into chunks of about this size.
  max_chars_per_request: 3000
  seconds_between_requests: 25
  style: >-
    Read this as a relaxed, quick-moving morning news podcast between two
    friends. Natural pace, clear diction, light warmth, no radio-announcer voice.

art:
  # One illustration per episode, of its lead story, made after the audio passes its checks.
  # Billed (about $0.04 per image). If every model fails the episode still publishes, with drawn ridgelines.
  enabled: true
  # Tried in order: Nano Banana 2.1 (Oct 2026), Nano Banana 2, the original Nano Banana.
  # There is no 3.8 image model yet; "Check feeds" lists what the key can use.
  models: [gemini-nano-banana-2.1, gemini-3.1-flash-image, gemini-2.5-flash-image]
  # Everything the image model is told, in one place. The prompt is: style, then rules, then the
  # lead story. Code always adds two more rules: 16:9, and no real, identifiable people (a photo-real
  # picture of someone in the news would be a fake news photo).
  # Tip: concrete photography words (place, light, lens, angle, moment) work better than "4K, award-winning".
  style: >-
    Award-winning editorial photograph, the kind a magazine runs as a full-page
    opener: a striking composition with one clear subject and crisp, rich
    detail, with deliberate, confident colour; never grey or washed-out. Shoot
    on location or in a studio, whichever tells this story best. The look
    below sets the light and the palette; apply it to this story.
  # Each image gets one look, drawn at random, never one used in the last `no_repeat` episodes.
  # Add, edit or remove lines freely; the more there are, the more varied the episodes.
  looks:
    # Light and time of day
    - bright midday sun, hard shadows, deep blue sky, saturated colours
    - early morning mist with soft pastel pinks and blues
    - golden hour, low warm sun and long shadows
    - blue hour, deep cobalt sky against warm lit windows
    - night city, neon signs and wet reflections in magenta and cyan
    - sodium street lights at night, deep orange against black
    - stormy sky with sunlight breaking through, dramatic contrast
    - heavy rain, glossy reflections and bright umbrellas
    - snow in bright sunshine, crisp white and blue with one red accent
    - cold winter morning, frost and pale gold sunlight
    - summer heat, bleached bright colours and sharp light
    - candlelight or firelight, warm amber against deep shadow
    - warm tungsten indoor light against cool daylight from a window
    - fluorescent industrial light with a green-cyan cast
    - backlit subject with a bright rim of light, the background falling into colour
    # Studio
    - studio shot on a seamless backdrop in one bold colour that suits the story, hard key light
    - studio lit with two contrasting coloured gels, sculpted shadows
    - bright high-key white studio, clean and airy, one strong accent colour
    - low-key studio, near-black background, a single spotlight, deep rich colour
    - top-down still life on a coloured surface with a hard graphic shadow
    - one object alone in a large field of flat colour, minimalist
    - direct on-camera flash at night, vivid colours against a dark background
    # Viewpoint and framing
    - aerial view straight down, graphic shapes and patterns of colour
    - extreme close-up of one telling detail, shallow depth of field
    - wide view with a small subject in a vast, colourful setting
    - low angle from the ground, looking up against a bright sky
    - framed through a window, doorway or gap, layered depth
    - seen in a reflection in a puddle, glass or mirror
    - long exposure, moving people or traffic blurred around a sharp subject
    - candid street photograph in a busy, colourful crowd
    # Colour palettes and film
    - 1970s slide-film look, warm saturated reds and yellows
    - cool film look with clean greens and teals
    - instant-film look with soft contrast and creamy colours
    - a single bold colour dominating the frame in many shades
    - primary colours, red, yellow and blue, graphic and clean
    - pastel palette of mint, peach and lavender in soft light
    - earthy browns and greens with one electric accent colour
    - autumn palette of rust, ochre and deep green
    - spring palette of fresh greens and blossom pink in clear light
    - mostly dark frame with one splash of saturated colour
    - shot through coloured glass, the colour washing over the scene
  no_repeat: 15
  rules:
    - >-
      The main subject is in the right third of the frame. The left side is part
      of the same photograph but quieter (open space, softer focus, less detail),
      because the episode title is laid over it.
    - >-
      Make it a real photograph: either a real location connected to the story,
      or a staged studio photograph of people or
      objects that stand for it. Physically real, no glowing effects, holograms,
      floating code, light beams or surreal mash-ups.
    - People are welcome as ordinary, anonymous people going about their day.
    - >-
      Don't write the story's headline or title in the image. Text that belongs to
      the place (street signs, billboards, screens) is fine.
    - No gore or graphic violence.
  # Render size (the model's default is 1K). 2K gives the 1600 px site image real detail.
  image_size: 2K
  width: 1600
  # Card colour for episodes without an image.
  fallback_color: "#3F8F75"

audio:
  bitrate: 128k
  gap_ms: 300
  intro: assets/intro.wav
  outro: assets/outro.wav
  # Real audio length vs target; outside this range only logs a warning.
  length_warning_tolerance: 0.25
