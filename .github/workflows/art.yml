name: Episode image

# Make (or remake) the image for a published episode, then rebuild the site.
# Uses GEMINI_API_KEY (billed: about $0.04 per image). Don't run it during the daily window
# (08:00–10:00 Tallinn): it shares the daily run's queue, where a newer pending run cancels an older one.
# It stops at once if a daily run is in progress. Previews change nothing and can run any time.
on:
  workflow_dispatch:
    inputs:
      date:
        description: Episode date, YYYY-MM-DD (empty = the newest episode)
        type: string
        default: ''
      preview:
        description: Preview only (images go to a downloadable artifact; nothing is committed)
        type: boolean
        default: false
      style:
        description: Style to use instead of art.style (separate several with || in a preview)
        type: string
        default: ''
      story:
        description: Preview only. Which of the episode's stories to illustrate, e.g. 1,2,3 (empty = the lead story)
        type: string
        default: ''

permissions: {}

concurrency:
  # Previews don't touch data/, so they don't queue with (or cancel) the daily run.
  group: ${{ inputs.preview && format('art-preview-{0}', github.run_id) || 'signal-check' }}
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Stop if a daily run is in progress
        if: ${{ !inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --status in_progress --json databaseId --jq '.[].databaseId')" ]; then
            echo "::error::A daily run is in progress; run this again after it finishes."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Make the image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATE: ${{ inputs.date }}
          SC_ART_STYLE: ${{ inputs.style }}
          SC_ART_PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
          SC_ART_STORY: ${{ inputs.story }}
        run: npm run art -- "$(echo "$DATE" | tr -d '[:space:]')"
      - name: Keep the previews
        if: ${{ inputs.preview }}
        uses: actions/upload-artifact@v7
        with:
          name: art-preview-${{ github.run_id }}
          path: out/art-preview/
          retention-days: 14
      - name: Commit
        if: ${{ !inputs.preview }}
        id: push
        env:
          DATE: ${{ inputs.date }}
        run: |
          DATE=$(echo "$DATE" | tr -d '[:space:]')
          git config user.name "signal-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Image for episode $(jq -r --arg d "$DATE" 'if $d == "" then .[-1] else (.[] | select(.date == $d)) end | .date' data/episodes.json)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && break
            sleep 5
          done
          git fetch -q origin main
          git diff --quiet origin/main HEAD || { echo "::error::Could not push the image"; exit 1; }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  site:
    needs: art
    if: ${{ !inputs.preview }}
    uses: ./.github/workflows/pages.yml
    with:
      sha: ${{ needs.art.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
