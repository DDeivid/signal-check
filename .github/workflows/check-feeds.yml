name: Check feeds

on:
  workflow_dispatch:
  schedule:
    # Sundays, so a dead feed shows up before the week starts.
    - cron: '23 6 * * 0'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-feeds
      - name: List Gemini models
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: '[ -n "$GEMINI_API_KEY" ] && npm run models || echo "GEMINI_API_KEY not set; skipping"'
