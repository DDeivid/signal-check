name: Pages

on:
  push:
    branches: [main]
    paths:
      - data/**
      - assets/cover.png
      - podcast.config.yaml
      - src/site.ts
      - src/feed.ts
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: Commit to build (the episode-history commit just pushed)
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # When called right after an episode is committed, build exactly that commit.
          ref: ${{ inputs.sha || 'main' }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
