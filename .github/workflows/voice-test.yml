name: Voice test

on:
  workflow_dispatch:
    inputs:
      voices:
        description: Voice pairs as Mia+Theo, comma-separated (empty = five default pairs)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Voice samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SC_VOICES: ${{ inputs.voices }}
        run: npm run voice-test
      - uses: actions/upload-artifact@v7
        with:
          name: voice-samples
          path: out/voices/
