name: CI

on:
  push:
    branches: [main]
    paths-ignore: [data/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - run: npm run typecheck
      - run: npm test
      - name: Rehearsal (whole pipeline offline with fake AI, safety gates included)
        run: npm run rehearsal
